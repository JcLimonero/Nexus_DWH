<svg viewBox="0 0 900 480" width="900" height="480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Flujo general de Nexus DWH</title>
  <desc id="d">En la sede del cliente, el agente NexusAgent extrae datos del DMS de origen y los carga (upsert) en el DWH destino. El agente inicia una conexion HTTPS saliente hacia el backend de Nexus, que expone el panel web a traves de un proxy /admin y guarda la configuracion y los eventos en su base de datos. Nexus nunca abre conexiones hacia la red del cliente.</desc>
  <rect width="900" height="480" fill="#ffffff" />

  <!-- Contenedor: Sede del cliente -->
  <rect x="24" y="24" width="380" height="400" rx="14" fill="none" stroke="#0d9488" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 6" />
  <text x="44" y="54" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f766e">Sede del cliente</text>

  <!-- Contenedor: Nexus -->
  <rect x="496" y="24" width="380" height="400" rx="14" fill="none" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="7 6" />
  <text x="516" y="54" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#6d28d9">Nexus</text>

  <!-- Nodos: sede del cliente (teal) -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="64" y="78" width="300" height="54" rx="10" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.5" />
    <text x="214" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">DMS de origen</text>
    <text x="214" y="116" text-anchor="middle" font-size="12" fill="#1e293b">(SQL Server, MySQL, Firebird...)</text>

    <line x1="214" y1="132" x2="214" y2="178" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="304" y="159" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">Extrae</text>

    <rect x="64" y="182" width="300" height="54" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5" />
    <text x="214" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">NexusAgent</text>
    <text x="214" y="220" text-anchor="middle" font-size="12" fill="#1e293b">(Servicio Windows)</text>

    <line x1="214" y1="236" x2="214" y2="282" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="314" y="263" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">Carga (upsert)</text>

    <rect x="64" y="286" width="300" height="54" rx="10" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.5" />
    <text x="214" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">DWH destino</text>
    <text x="214" y="324" text-anchor="middle" font-size="12" fill="#1e293b">(PostgreSQL por grupo o empresa)</text>
  </g>

  <!-- Nodos: Nexus (violeta) -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="536" y="78" width="300" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" />
    <text x="686" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Panel web</text>

    <line x1="686" y1="122" x2="686" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="536" y="162" width="300" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" />
    <text x="686" y="189" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Proxy /admin</text>

    <line x1="686" y1="206" x2="686" y2="242" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="536" y="246" width="300" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <text x="686" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Backend FastAPI</text>
    <text x="686" y="284" text-anchor="middle" font-size="12" fill="#1e293b">(/agent, /admin, evaluador)</text>

    <line x1="686" y1="300" x2="686" y2="336" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="750" y="327" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6d28d9">Config, eventos</text>

    <rect x="536" y="340" width="300" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" />
    <text x="686" y="367" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">BD de configuración</text>
  </g>

  <!-- Flecha horizontal: agente -> backend -->
  <line x1="364" y1="209" x2="530" y2="273" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)" />
  <rect x="378" y="216" width="128" height="20" rx="4" fill="#f8fafc" />
  <text x="442" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">HTTPS saliente</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155" />
    </marker>
  </defs>

  <text x="450" y="458" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#475569">El agente inicia todas las conexiones; Nexus nunca entra a la red del cliente.</text>
</svg>
