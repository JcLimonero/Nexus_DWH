# CI de Nexus DWH (fase 5).
#  * backend-agente: pruebas del backend y del agente con PostgreSQL en contenedores (mismos
#    nombres/puertos que el entorno Docker local de DWH_README.md §17.12).
#  * panel: typecheck, lint y build del panel Next.js.
#  * agente-windows: compila NexusAgent.exe con Nuitka en windows-latest, verifica el paquete,
#    ejecuta --selftest, prueba DPAPI/WinVerifyTrust reales y el servicio (instalación con cuenta
#    virtual, parada, actualización con vuelta atrás, desinstalación) y publica el paquete SIN FIRMAR.
#    La firma Authenticode es opcional (variables del repositorio; ver DWH_README.md §21.5).
# Permisos mínimos; ningún paso imprime secretos.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-agente:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PostgreSQL de prueba (configuración, origen y DWH)
        run: |
          docker run -d --name nexus_dwh_pg_dev  -e POSTGRES_PASSWORD=devpass -p 5546:5432 postgres:16-alpine
          docker run -d --name nexus_dwh_test_src -e POSTGRES_PASSWORD=src-test-pass-7Qx -e POSTGRES_DB=dms_test -p 5547:5432 postgres:16-alpine
          docker run -d --name nexus_dwh_test_dwh -e POSTGRES_PASSWORD=dwh-test-pass-9Kz -e POSTGRES_DB=dwh_test -p 5548:5432 postgres:16-alpine
          for c in nexus_dwh_pg_dev nexus_dwh_test_src nexus_dwh_test_dwh; do
            for i in $(seq 1 60); do docker exec "$c" pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          done

      - name: unixODBC (lo necesita pyodbc para importarse)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unixodbc

      - name: Entornos virtuales
        run: |
          python -m venv dwh_back/.venv
          dwh_back/.venv/bin/pip install -q -r dwh_back/requirements_postgres.txt -r dwh_back/requirements_dev.txt
          python -m venv dwh_client/.venv
          dwh_client/.venv/bin/pip install -q -r dwh_client/requirements_postgres.txt -r dwh_client/requirements_dev.txt

      - name: Pruebas del backend
        working-directory: dwh_back
        run: .venv/bin/python -m pytest tests -q -p no:cacheprovider

      - name: Pruebas del agente
        working-directory: dwh_client
        run: .venv/bin/python -m pytest tests -q -p no:cacheprovider

  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dwh_front
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: dwh_front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  agente-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: dwh_client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Entorno de build (Nuitka + dependencias fijadas)
        run: |
          python -m venv build\venv-build
          build\venv-build\Scripts\python -m pip install -q --disable-pip-version-check -r requirements_build.txt -r requirements_dev.txt

      - name: Pruebas de empaquetado (DPAPI y WinVerifyTrust reales)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: build\venv-build\Scripts\python -m pytest tests\test_packaging.py -q -p no:cacheprovider

      - name: Compilar NexusAgent.exe (Nuitka standalone) y verificar el paquete
        run: build\venv-build\Scripts\python packaging\build_agent.py --allow-downloads

      - name: Ejecutable compilado --version / --selftest / --verify-update
        run: |
          $exe = "build\dist\NexusAgent\NexusAgent.exe"
          & $exe --version; if ($LASTEXITCODE) { exit 1 }
          & $exe --selftest; if ($LASTEXITCODE) { exit 1 }
          & $exe --verify-update build\dist\NexusAgent --allow-same-version --allow-unsigned-manifest; if ($LASTEXITCODE) { exit 1 }
          & $exe --verify-update build\dist\NexusAgent --allow-same-version
          if ($LASTEXITCODE -ne 4) { Write-Error "Un manifiesto sin firma debe rechazarse (4) sin --allow-unsigned-manifest; fue $LASTEXITCODE"; exit 1 }
          # El envoltorio de GitHub para pwsh termina con el código del ÚLTIMO comando nativo: el 4
          # esperado haría fallar el paso. Todas las comprobaciones pasaron: se sale con 0 explícito.
          exit 0

      - name: Servicio con cuenta virtual (instalar, DPAPI, errores de configuración, actualización con vuelta atrás, desinstalar)
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (Resolve-Path build\dist\NexusAgent).Path
          $installed = 'C:\Program Files\NexusAgent'
          $update = "$installed\scripts\update_agent.ps1"   # siempre la copia INSTALADA del script
          $log = 'C:\ProgramData\NexusAgent\logs\nexus_agent.log'
          $cfg = 'C:\ProgramData\NexusAgent\config.ini'
          function Assert($cond, $msg) { if (-not $cond) { Write-Error $msg; exit 1 } }
          function Assert-OldVersionRunning($label) {
            Start-Sleep -Seconds 5
            Assert ((Get-Service NexusAgent).Status -eq 'Running') "${label}: el servicio no está en ejecución tras la vuelta atrás"
            $v = (& "$installed\NexusAgent.exe" --version).Trim()
            Assert ($v -eq $script:origVersion) "${label}: versión instalada $v, se esperaba $script:origVersion"
            Assert (-not (Get-ChildItem 'C:\Program Files' -Directory -Filter 'NexusAgent.new-*')) "${label}: quedó una carpeta de trabajo"
          }

          # 1) Instalación sin token: arranca, comprueba DPAPI con su cuenta y se detiene con código 2.
          $t0 = Get-Date
          & "$pkg\scripts\install_service.ps1" -PackageDir $pkg -ApiUrl 'http://127.0.0.1:9' -AllowUnsignedManifest
          Assert ($LASTEXITCODE -eq 2) "install_service.ps1 debía terminar con 2 (sin token), fue $LASTEXITCODE"
          $script:origVersion = (& "$installed\NexusAgent.exe" --version).Trim()
          sc.exe qc NexusAgent; sc.exe qprivs NexusAgent; sc.exe qfailure NexusAgent; sc.exe query NexusAgent
          $svc = Get-CimInstance Win32_Service -Filter "Name='NexusAgent'"
          Assert ($svc.StartName -eq 'NT SERVICE\NexusAgent') "Cuenta del servicio: $($svc.StartName)"
          Assert ($svc.StartMode -eq 'Auto') "Modo de inicio: $($svc.StartMode)"
          Assert ((sc.exe qprivs NexusAgent | Out-String) -match 'SeChangeNotifyPrivilege') 'Privilegios requeridos no fijados'
          Assert ((sc.exe query NexusAgent | Out-String) -match 'SERVICE_EXIT_CODE\s*:\s*2') 'Código específico 2 no reportado'
          $content = Get-Content -Raw -Encoding UTF8 $log
          Write-Host $content
          Assert ($content -match 'Cuenta: NexusAgent') 'El log no muestra la cuenta virtual'
          Assert ($content -match 'DPAPI \(user\) OK') 'DPAPI de usuario no funcionó con la cuenta virtual'
          Assert ($content -match 'No hay credencial de instalación') 'Falta el error esperado de configuración'
          $ev = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $t0 } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Nexus DWH Agent' }
          if ($ev) { Write-Host "Registro de eventos: $($ev[0].Message)" } else { Write-Warning 'No se encontró el evento de aplicación del agente (revisar LogErrorMsg)' }
          icacls C:\ProgramData\NexusAgent; icacls C:\ProgramData\NexusAgent\data; icacls $installed
          $acl = (icacls C:\ProgramData\NexusAgent\data | Out-String)
          Assert (-not ($acl -match 'BUILTIN\\Users|Everyone|Authenticated Users')) 'La carpeta de datos da acceso a Usuarios'

          # 1b) config.ini inválido: el servicio se detiene con 2 y deja el motivo en el log.
          Copy-Item $cfg "$cfg.bak"
          Add-Content -Path $cfg -Value "`r`n[agent]`r`nheartbeat_seconds = no-es-numero"
          try { Start-Service NexusAgent -ErrorAction Stop } catch { }
          Start-Sleep -Seconds 10
          Assert ((Get-Service NexusAgent).Status -eq 'Stopped') 'Con config inválido el servicio debía detenerse'
          Assert ((Get-Content -Raw -Encoding UTF8 $log) -match 'Error de configuración') 'El error de configuración no llegó al log'
          Move-Item -Force "$cfg.bak" $cfg

          # 2) Token de un solo uso con Nexus inaccesible: el servicio queda en ejecución reintentando.
          [IO.File]::WriteAllText('C:\ProgramData\NexusAgent\data\enrollment_token.ini', "[nexus]`r`nagency_token = token-ficticio-ci`r`n")
          Start-Service NexusAgent
          Start-Sleep -Seconds 20
          Assert ((Get-Service NexusAgent).Status -eq 'Running') 'El servicio no quedó en ejecución'
          Assert ((Get-Content -Raw -Encoding UTF8 $log) -match 'Nexus no disponible para enrolar') 'No reintentó el enrolamiento'
          Assert (-not ((Get-Content -Raw -Encoding UTF8 $log) -match 'token-ficticio-ci')) 'El token apareció en el log'

          # 3) Paquete 9.9.9 cuyo binario sigue siendo 5.x: valida, cambia, la salud no ve un arranque
          #    de v9.9.9 posterior al cambio -> restaura la versión anterior (código 3).
          $fake = Join-Path $env:RUNNER_TEMP 'pkg999'
          Copy-Item -Recurse $pkg $fake
          $m = Get-Content -Raw -Encoding UTF8 "$fake\release.json" | ConvertFrom-Json
          $m.version = '9.9.9'
          [IO.File]::WriteAllText("$fake\release.json", ($m | ConvertTo-Json -Depth 10))
          & $update -PackageDir $fake -AllowUnsignedManifest -HealthSeconds 20
          Assert ($LASTEXITCODE -eq 3) "Salud fallida: update_agent.ps1 debía restaurar (3), fue $LASTEXITCODE"
          Assert-OldVersionRunning 'Salud fallida'

          # 3b) Paquete cuyo ejecutable NO arranca como servicio (termina al instante): Start-Service
          #     falla con excepción -> la restauración igual ocurre (código 3).
          $broken = Join-Path $env:RUNNER_TEMP 'pkgbroken'
          Copy-Item -Recurse $pkg $broken
          Copy-Item -Force "$env:SystemRoot\System32\whoami.exe" "$broken\NexusAgent.exe"
          build\venv-build\Scripts\python packaging\make_manifest.py --package $broken
          if ($LASTEXITCODE) { exit 1 }
          $mb = Get-Content -Raw -Encoding UTF8 "$broken\release.json" | ConvertFrom-Json
          $mb.version = '9.9.8'
          [IO.File]::WriteAllText("$broken\release.json", ($mb | ConvertTo-Json -Depth 10))
          & $update -PackageDir $broken -AllowUnsignedManifest -HealthSeconds 20
          Assert ($LASTEXITCODE -eq 3) "Ejecutable que no arranca: se esperaba 3, fue $LASTEXITCODE"
          Assert-OldVersionRunning 'Ejecutable que no arranca'
          Assert (Test-Path 'C:\Program Files\NexusAgent.failed-*') 'No quedó la versión fallida para diagnóstico'

          # 3c) Carpeta del programa bloqueada (proceso con cwd dentro): el cambio de nombre falla tras
          #     los reintentos -> no se pierde el programa y el servicio vuelve a correr.
          $holder = Start-Process -FilePath powershell.exe -ArgumentList '-NoProfile', '-Command', 'Start-Sleep -Seconds 300' `
            -WorkingDirectory "$installed\scripts" -PassThru -WindowStyle Hidden
          & $update -PackageDir $fake -AllowUnsignedManifest -HealthSeconds 10
          $rc = $LASTEXITCODE
          Stop-Process -Id $holder.Id -Force -ErrorAction SilentlyContinue
          Assert ($rc -eq 3 -or $rc -eq 1) "Carpeta bloqueada: se esperaba 3 (o 1 con mensaje), fue $rc"
          Assert-OldVersionRunning 'Carpeta bloqueada'

          # 4) Un paquete alterado debe rechazarse antes de tocar nada (código 4).
          $bad = Join-Path $env:RUNNER_TEMP 'pkgbad'
          Copy-Item -Recurse $fake $bad
          Add-Content -Path "$bad\LEEME.txt" -Value 'alterado'
          & $update -PackageDir $bad -AllowUnsignedManifest -HealthSeconds 20
          Assert ($LASTEXITCODE -eq 4) "Paquete alterado: se esperaba 4, fue $LASTEXITCODE"
          Assert-OldVersionRunning 'Paquete alterado'

          # 5) Reinstalación conservando datos: los archivos que creó el servicio (propietario
          #    NT SERVICE\NexusAgent) en data\ y logs\ no deben hacer abortar al instalador.
          Assert (Test-Path 'C:\ProgramData\NexusAgent\logs\nexus_agent.log') 'El servicio no dejó log propio antes de reinstalar'
          & "$installed\scripts\uninstall_service.ps1" -RemoveProgram -Confirm:$false
          Assert ($LASTEXITCODE -eq 0) 'uninstall_service.ps1 (conservando datos) falló'
          # El token del paso 2 nunca se consumió (Nexus inaccesible): se quita para esperar el código 2.
          Remove-Item -LiteralPath 'C:\ProgramData\NexusAgent\data\enrollment_token.ini' -Force -ErrorAction SilentlyContinue
          # sc delete puede dejar el servicio "marcado para eliminación" unos segundos.
          for ($i = 0; $i -lt 30 -and (Get-Service NexusAgent -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
          Assert (-not (Get-Service NexusAgent -ErrorAction SilentlyContinue)) 'El servicio sigue registrado antes de reinstalar'
          & "$pkg\scripts\install_service.ps1" -PackageDir $pkg -AllowUnsignedManifest *>&1 | Tee-Object -Variable reinstallOut
          Assert (-not (($reinstallOut | Out-String) -match 'pertenece a')) 'La reinstalación abortó por propietario de archivos del servicio'
          Assert ($LASTEXITCODE -eq 2) "Reinstalación con datos conservados: se esperaba 2 (sin token), fue $LASTEXITCODE"

          # 6) Desinstalación completa.
          & "$installed\scripts\uninstall_service.ps1" -RemoveProgram -RemoveData -Confirm:$false
          Assert ($LASTEXITCODE -eq 0) 'uninstall_service.ps1 falló'
          Assert (-not (Get-Service NexusAgent -ErrorAction SilentlyContinue)) 'El servicio sigue registrado'
          exit 0

      - name: Nombre del artefacto
        id: name
        run: |
          $v = (& build\dist\NexusAgent\NexusAgent.exe --version).Trim()
          "artifact=NexusAgent-$v-windows-x64-SIN-FIRMAR" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            dwh_client/build/dist/NexusAgent
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuitka-report
          path: dwh_client/build/nuitka-report.xml
          if-no-files-found: ignore
          retention-days: 7

  # Firma Authenticode OPCIONAL y separada: nunca en pull requests, solo con el entorno protegido
  # "firma-codigo" (reglas de aprobación/ramas en GitHub) y si el repositorio define vars.NEXUS_SIGN_MODE.
  # Sin eso el único artefacto es el SIN FIRMAR. Los valores pasan por env (no se interpolan en el script).
  firma-windows:
    needs: agente-windows
    if: ${{ github.event_name != 'pull_request' && vars.NEXUS_SIGN_MODE != '' }}
    runs-on: windows-latest
    environment: firma-codigo
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: dwh_client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Dependencias de las herramientas de manifiesto
        run: python -m pip install -q --disable-pip-version-check -r requirements_postgres.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: NexusAgent-*-SIN-FIRMAR
          path: dwh_client/build/descarga
      - name: Firmar (signtool) y regenerar release.json
        env:
          SIGN_MODE: ${{ vars.NEXUS_SIGN_MODE }}
          SIGN_TIMESTAMP_URL: ${{ vars.NEXUS_SIGN_TIMESTAMP_URL }}
          SIGN_CERT_THUMBPRINT: ${{ vars.NEXUS_SIGN_CERT_THUMBPRINT }}
          SIGN_DLIB: ${{ vars.NEXUS_SIGN_DLIB }}
          SIGN_METADATA: ${{ vars.NEXUS_SIGN_METADATA }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $dir = (Get-ChildItem build\descarga -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force build\dist | Out-Null
          Move-Item $dir build\dist\NexusAgent
          & packaging\windows\sign_release.ps1 -PackageDir build\dist\NexusAgent -Mode $env:SIGN_MODE `
            -TimestampUrl $env:SIGN_TIMESTAMP_URL -CertThumbprint $env:SIGN_CERT_THUMBPRINT `
            -DlibPath $env:SIGN_DLIB -MetadataPath $env:SIGN_METADATA -Python (Get-Command python).Source
          if ($LASTEXITCODE) { exit 1 }
          python packaging\verify_package.py build\dist\NexusAgent
          if ($LASTEXITCODE) { exit 1 }
          $v = (& build\dist\NexusAgent\NexusAgent.exe --version).Trim()
          "ARTIFACT=NexusAgent-$v-windows-x64-firmado" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dwh_client/build/dist/NexusAgent
          if-no-files-found: error
          retention-days: 14
